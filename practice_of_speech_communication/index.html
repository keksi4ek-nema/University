<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>3D Просмотр аудитории</title>

  <!-- Three.js r132 (0.132.2) + GSAP — строго с одного CDN, без ES-модулей -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(18, 22, 30, 0.72);
      --glass-bg-strong: rgba(18, 22, 30, 0.86);
      --glass-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.22);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.22);
      --shadow-ui: 0 12px 32px rgba(0, 0, 0, 0.38);
      --radius: 12px;
      --radius-sm: 8px;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #141820;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overscroll-behavior: none;
    }

    button, input {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      touch-action: none;
      overflow: hidden;
    }

    #viewport canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }

    /* ==================== ВЕРХНИЙ ЛЕВЫЙ HUD ==================== */
    .hud-top-left {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }

    .chip-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-main);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow-ui);
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }

    .chip-btn:hover {
      background: var(--glass-bg-strong);
      border-color: var(--border-strong);
    }

    .chip-btn:active {
      transform: scale(0.97);
    }

    .chip-btn.active {
      background: rgba(30, 58, 138, 0.72);
      border-color: rgba(96, 165, 250, 0.65);
      color: #ffffff;
    }

    .ico {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ==================== ВЫПАДАЮЩИЕ ПАНЕЛИ ==================== */
    .dropdown-panel {
      display: none;
      width: 282px;
      max-width: calc(100vw - 24px);
      max-height: calc(100dvh - 76px);
      overflow-y: auto;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-ui);
      pointer-events: auto;
      animation: panelIn 0.16s ease;
    }

    .dropdown-panel.open {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-panel::-webkit-scrollbar { width: 5px; }
    .dropdown-panel::-webkit-scrollbar-track { background: transparent; }
    .dropdown-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 99px; }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 0 2px;
    }

    /* ==================== СПИСОК РАКУРСОВ ==================== */
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .preset-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .preset-btn:hover {
      background: var(--glass-hover);
      border-color: var(--border);
    }

    .preset-btn.active {
      background: var(--accent-soft);
      border-color: rgba(96, 165, 250, 0.55);
      color: #ffffff;
    }

    .preset-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .preset-name {
      font-weight: 500;
      font-size: 13px;
    }

    .preset-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .preset-btn.active .preset-sub {
      color: #bfdbfe;
    }

    .preset-idx {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.07);
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .preset-btn.active .preset-idx {
      background: rgba(59, 130, 246, 0.35);
      color: #dbeafe;
    }

    /* ==================== НАСТРОЙКИ РЕНДЕРА ==================== */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
    }

    .control-val {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-main);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #ffffff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #ffffff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-main);
    }

    .switch-btn {
      position: relative;
      width: 40px;
      height: 22px;
      border-radius: 99px;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: background 0.16s, border-color 0.16s;
      flex-shrink: 0;
    }

    .switch-btn::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.16s ease;
    }

    .switch-btn.on {
      background: var(--accent);
      border-color: var(--accent);
    }

    .switch-btn.on::after {
      transform: translateX(18px);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 3px;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border);
    }

    .seg-btn {
      height: 27px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.14s, color 0.14s;
    }

    .seg-btn:hover {
      color: var(--text-main);
    }

    .seg-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    .action-btn {
      width: 100%;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-strong);
    }

    /* ==================== ИНДИКАТОР ЗАГРУЗКИ ==================== */
    .loader-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 99px;
      border: 1px solid var(--border-strong);
      background: var(--glass-bg-strong);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow-ui);
      font-size: 13px;
      color: var(--text-main);
      max-width: calc(100vw - 32px);
      transition: opacity 0.25s ease;
    }

    .loader-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-overlay.error {
      border-radius: var(--radius);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fecaca;
      padding: 14px 16px;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      max-width: 340px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==================== АДАПТИВ ДЛЯ СМАРТФОНОВ ==================== */
    @media (max-width: 520px) {
      .chip-btn {
        height: 34px;
        padding: 0 10px;
        font-size: 12.5px;
      }

      #btn-snapshot .chip-label {
        display: none;
      }

      #btn-snapshot {
        width: 36px;
        padding: 0;
      }

      .dropdown-panel {
        width: min(296px, calc(100vw - 24px));
      }
    }
  </style>
</head>
<body>
  <div id="viewport"></div>

  <!-- Компактные ярлыки слева сверху -->
  <div class="hud-top-left">
    <div class="chip-bar" role="toolbar" aria-label="Панель управления просмотром">
      <button id="btn-tab-views" class="chip-btn" type="button" aria-expanded="false" aria-controls="panel-views">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M23 7l-7 5 7 5V7z"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <span>Ракурсы</span>
      </button>

      <button id="btn-tab-render" class="chip-btn" type="button" aria-expanded="false" aria-controls="panel-render">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="5"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
          <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
          <line x1="2" y1="12" x2="5" y2="12"/>
          <line x1="19" y1="12" x2="22" y2="12"/>
          <line x1="4.93" y1="19.07" x2="7.05" y2="16.95"/>
          <line x1="16.95" y1="7.05" x2="19.07" y2="4.93"/>
        </svg>
        <span>Рендер</span>
      </button>

      <button id="btn-snapshot" class="chip-btn" type="button" title="Сохранить снимок PNG" aria-label="Снимок PNG">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span class="chip-label">Снимок PNG</span>
      </button>
    </div>

    <!-- Выпадающая вкладка «Ракурсы» -->
    <section id="panel-views" class="dropdown-panel" aria-label="Ракурсы камеры">
      <div class="panel-title">Ракурсы аудитории</div>
      <div id="preset-list" class="preset-list"></div>
    </section>

    <!-- Выпадающая вкладка «Рендер» -->
    <section id="panel-render" class="dropdown-panel" aria-label="Настройки рендера и света">
      <div class="panel-title">Освещение интерьера</div>

      <div class="control-group">
        <div class="control-label">
          <span>Экспозиция</span>
          <span id="val-exposure" class="control-val">0.95</span>
        </div>
        <input id="slider-exposure" type="range" min="0.50" max="1.60" step="0.02" value="0.95" />
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Солнечный свет (из окон)</span>
          <span id="val-sun-intensity" class="control-val">1.35</span>
        </div>
        <input id="slider-sun-intensity" type="range" min="0.00" max="3.00" step="0.05" value="1.35" />
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Направление солнца</span>
          <span id="val-sun-azimuth" class="control-val">75°</span>
        </div>
        <input id="slider-sun-azimuth" type="range" min="0" max="360" step="1" value="75" />
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Высота солнца</span>
          <span id="val-sun-elevation" class="control-val">32°</span>
        </div>
        <input id="slider-sun-elevation" type="range" min="8" max="80" step="1" value="32" />
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Заполняющий свет</span>
          <span id="val-fill" class="control-val">1.00</span>
        </div>
        <input id="slider-fill" type="range" min="0.15" max="2.20" step="0.05" value="1.00" />
      </div>

      <div class="divider"></div>

      <div class="toggle-row">
        <span>Мягкие тени</span>
        <button id="btn-shadows" class="switch-btn on" type="button" role="switch" aria-checked="true" aria-label="Переключить тени"></button>
      </div>

      <div class="control-group">
        <div class="control-label"><span>Фон сцены</span></div>
        <div id="bg-mode-group" class="segmented">
          <button class="seg-btn active" type="button" data-bg="dark">Тёмный</button>
          <button class="seg-btn" type="button" data-bg="light">Светлый</button>
          <button class="seg-btn" type="button" data-bg="neutral">Нейтр.</button>
        </div>
      </div>

      <button id="btn-reset-light" class="action-btn" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
        <span>Сбросить свет</span>
      </button>
    </section>
  </div>

  <!-- Компактный индикатор загрузки -->
  <div id="loader-overlay" class="loader-overlay" role="status" aria-live="polite">
    <div class="spinner" id="loader-spinner"></div>
    <span id="loader-text">Загрузка 3D-модели…</span>
  </div>

  <script>
  (() => {
    'use strict';

    /* =========================================================================
       1. НАСТРОЙКИ МОДЕЛИ И ПРЕСЕТЫ КАМЕРЫ (ЛЕГКО КОРРЕКТИРОВАТЬ ВРУЧНУЮ)
       ========================================================================= */

    // Относительный путь к .glb файлу рядом с index.html в репозитории GitHub Pages.
    // Замените 'model.glb' на точное имя вашего файла, если оно отличается.
    const MODEL_URL = './model.glb';

    // 5 ракурсов, рассчитанных по центрированной геометрии аудитории (в метрах):
    //   Комната Plane: X ∈ [-5.02, +5.02], Y ∈ [0.00, 3.65], Z ∈ [-8.75, +8.75]
    //   Учебная доска Plane.002: у стены Z ≈ +8.74
    //   Стол преподавателя Cube.005 / кресло Cube.006: X ≈ +2.96, Z ≈ +4.81
    //   Столы студентов Cube.004: X ∈ [-4.46, +4.06], Z ∈ [-6.10, +4.27]
    //
    // Чтобы зафиксировать свои координаты вручную, измените position/target
    // и поставьте autoFit: false у нужного ракурса.
    const CAMERA_PRESETS = {
      overview: {
        label: 'Общий план',
        hint: 'Обзор 360° из центра',
        position: [0.0, 1.62, 0.0],
        target: [0.0, 1.58, 0.08], // Минимальная дистанция (~8 см) для вращения 360° вокруг себя
        autoFit: true
      },
      windowSide: {
        label: 'Оконная зона',
        hint: 'Стена с окнами',
        position: [-2.35, 1.65, -2.10],
        target: [4.85, 1.65, 1.25],
        autoFit: true
      },
      innerWall: {
        label: 'Зона напротив окон',
        hint: 'Внутренняя стена',
        position: [2.35, 1.65, -2.00],
        target: [-4.85, 1.65, 1.35],
        autoFit: true
      },
      teacherDesk: {
        label: 'Стол преподавателя',
        hint: 'Рабочее место преподавателя',
        position: [2.60, 2.10, 7.00],
        target: [2.88, 0.80, 4.88],
        autoFit: true
      },
      studentDesk: {
        label: 'Стол студента',
        hint: 'Рабочее место студента',
        position: [-1.45, 2.20, -0.35],
        target: [-0.15, 0.78, 1.05],
        autoFit: true
      }
    };

    // Базовые настройки света для светло-серого интерьера без пересветов и провалов
    const DEFAULT_LIGHTING = {
      exposure: 0.95,
      sunIntensity: 1.35,
      sunAzimuth: 75,     // Будет автоматически подстроен под найденную оконную стену
      sunElevation: 32,   // Угол, при котором лучи проходят через оконные проёмы внутрь
      fillIntensity: 1.0,
      shadows: true,
      bgMode: 'dark'
    };

    /* =========================================================================
       2. ПРОВЕРКА ЗАВИСИМОСТЕЙ И DOM-ЭЛЕМЕНТЫ
       ========================================================================= */
    const dom = {
      viewport: document.getElementById('viewport'),
      btnTabViews: document.getElementById('btn-tab-views'),
      btnTabRender: document.getElementById('btn-tab-render'),
      btnSnapshot: document.getElementById('btn-snapshot'),
      panelViews: document.getElementById('panel-views'),
      panelRender: document.getElementById('panel-render'),
      presetList: document.getElementById('preset-list'),
      loaderOverlay: document.getElementById('loader-overlay'),
      loaderSpinner: document.getElementById('loader-spinner'),
      loaderText: document.getElementById('loader-text'),
      sliderExposure: document.getElementById('slider-exposure'),
      valExposure: document.getElementById('val-exposure'),
      sliderSunIntensity: document.getElementById('slider-sun-intensity'),
      valSunIntensity: document.getElementById('val-sun-intensity'),
      sliderSunAzimuth: document.getElementById('slider-sun-azimuth'),
      valSunAzimuth: document.getElementById('val-sun-azimuth'),
      sliderSunElevation: document.getElementById('slider-sun-elevation'),
      valSunElevation: document.getElementById('val-sun-elevation'),
      sliderFill: document.getElementById('slider-fill'),
      valFill: document.getElementById('val-fill'),
      btnShadows: document.getElementById('btn-shadows'),
      btnResetLight: document.getElementById('btn-reset-light')
    };

    function showLoaderError(title, detail) {
      dom.loaderOverlay.classList.remove('hidden');
      dom.loaderOverlay.classList.add('error');
      dom.loaderSpinner.style.display = 'none';
      dom.loaderText.innerHTML =
        '<strong>' + title + '</strong><br><span style="font-size:12px;opacity:0.88">' + detail + '</span>';
    }

    if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
      showLoaderError('Не удалось загрузить 3D-движок', 'Проверьте доступность cdn.jsdelivr.net.');
      return;
    }

    const HAS_GSAP = typeof gsap !== 'undefined';

    /* =========================================================================
       3. СЦЕНА, КАМЕРА, PBR-РЕНДЕРЕР И ПРОЦЕДУРНАЯ СРЕДА (PMREM)
       ========================================================================= */
    const scene = new THREE.Scene();

    const BG_COLORS = {
      dark: new THREE.Color(0x141820),
      light: new THREE.Color(0xe9eef5),
      neutral: new THREE.Color(0x646c79)
    };
    scene.background = BG_COLORS.dark;

    // Параметры камеры адаптированы под работу внутри помещения
    const camera = new THREE.PerspectiveCamera(56, 1, 0.03, 150);
    camera.position.set(0, 1.62, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = DEFAULT_LIGHTING.exposure;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    dom.viewport.appendChild(renderer.domElement);

    // Локальная процедурная карта окружения через PMREMGenerator (без внешних HDRI и jsm)
    function buildInteriorEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileCubemapShader();

      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x28303d);

      const shellGeo = new THREE.BoxGeometry(20, 12, 20);
      const shellMat = new THREE.MeshStandardMaterial({
        color: 0x4b5563,
        roughness: 0.92,
        metalness: 0.0,
        side: THREE.BackSide
      });
      const shell = new THREE.Mesh(shellGeo, shellMat);
      envScene.add(shell);

      const emitters = [
        // Потолочный рассеянный свет
        { pos: [0, 5.7, 0], rot: [Math.PI / 2, 0, 0], size: [12, 12], color: 0xf4f7fb, mult: 1.9 },
        // Имитация светлого окна сбоку
        { pos: [9.6, 1.5, 0], rot: [0, -Math.PI / 2, 0], size: [14, 5], color: 0xfff8ec, mult: 2.6 },
        // Мягкий отражённый свет от противоположной стены
        { pos: [-9.6, 1.0, 0], rot: [0, Math.PI / 2, 0], size: [12, 4.5], color: 0xdbe7f8, mult: 1.1 },
        // Тёплый отскок от пола
        { pos: [0, -5.7, 0], rot: [-Math.PI / 2, 0, 0], size: [14, 14], color: 0x5c5852, mult: 0.7 }
      ];

      const disposables = [shellGeo, shellMat];
      emitters.forEach((p) => {
        const g = new THREE.PlaneGeometry(p.size[0], p.size[1]);
        const c = new THREE.Color(p.color).multiplyScalar(p.mult);
        const m = new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(g, m);
        mesh.position.set(p.pos[0], p.pos[1], p.pos[2]);
        mesh.rotation.set(p.rot[0], p.rot[1], p.rot[2]);
        envScene.add(mesh);
        disposables.push(g, m);
      });

      const rt = pmrem.fromScene(envScene, 0.05);
      disposables.forEach((item) => item.dispose());
      pmrem.dispose();
      return rt;
    }

    const envRenderTarget = buildInteriorEnvironment();
    scene.environment = envRenderTarget.texture;

    /* =========================================================================
       4. ОСВЕЩЕНИЕ ИНТЕРЬЕРА И ТЕНИ
       ========================================================================= */
    const BASE_HEMI_INTENSITY = 0.56;
    const BASE_AMBIENT_INTENSITY = 0.22;

    const ambientLight = new THREE.AmbientLight(0xffffff, BASE_AMBIENT_INTENSITY);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xf1f6ff, 0x4c5463, BASE_HEMI_INTENSITY);
    hemiLight.position.set(0, 12, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e4, DEFAULT_LIGHTING.sunIntensity);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.bias = -0.0004;
    sunLight.shadow.normalBias = 0.035;
    scene.add(sunLight);
    scene.add(sunLight.target);

    const lightState = { ...DEFAULT_LIGHTING };
    const roomBounds = new THREE.Box3(
      new THREE.Vector3(-5.02, 0, -8.75),
      new THREE.Vector3(5.02, 3.65, 8.75)
    );

    function updateSunAndShadowBounds() {
      const center = new THREE.Vector3();
      const sphere = new THREE.Sphere();
      roomBounds.getCenter(center);
      roomBounds.getBoundingSphere(sphere);
      const radius = Math.max(sphere.radius, 5.0);

      const az = THREE.MathUtils.degToRad(lightState.sunAzimuth);
      const el = THREE.MathUtils.degToRad(lightState.sunElevation);
      const dist = radius * 2.4;

      sunLight.position.set(
        center.x + dist * Math.cos(el) * Math.sin(az),
        center.y + dist * Math.sin(el),
        center.z + dist * Math.cos(el) * Math.cos(az)
      );
      sunLight.target.position.copy(center);
      sunLight.target.updateMatrixWorld();

      const d = radius * 1.12;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.camera.near = Math.max(0.5, dist - radius * 1.6);
      sunLight.shadow.camera.far = dist + radius * 1.8;
      sunLight.shadow.camera.updateProjectionMatrix();
      sunLight.shadow.needsUpdate = true;
    }

    /* =========================================================================
       5. ORBITCONTROLS (КОМФОРТНОЕ УПРАВЛЕНИЕ В ИНТЕРЬЕРЕ + TOUCH)
       ========================================================================= */
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.screenSpacePanning = true;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 0.75;
    controls.panSpeed = 0.65;
    controls.minDistance = 0.02;
    controls.maxDistance = 16;
    controls.minPolarAngle = Math.PI * 0.06;
    controls.maxPolarAngle = Math.PI * 0.94;
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    function killCameraTweens() {
      if (HAS_GSAP) {
        gsap.killTweensOf(camera.position);
        gsap.killTweensOf(controls.target);
      }
    }

    renderer.domElement.addEventListener('pointerdown', killCameraTweens, { passive: true });
    renderer.domElement.addEventListener('wheel', killCameraTweens, { passive: true });
    renderer.domElement.addEventListener('touchstart', killCameraTweens, { passive: true });

    let activePresetKey = 'overview';

    function flyToPreset(key, duration = 0.95) {
      const preset = CAMERA_PRESETS[key];
      if (!preset) return;

      activePresetKey = key;
      updateActivePresetUI();
      killCameraTweens();

      const [px, py, pz] = preset.position;
      const [tx, ty, tz] = preset.target;

      if (HAS_GSAP && duration > 0) {
        gsap.to(camera.position, {
          x: px,
          y: py,
          z: pz,
          duration,
          ease: 'power2.inOut'
        });
        gsap.to(controls.target, {
          x: tx,
          y: ty,
          z: tz,
          duration,
          ease: 'power2.inOut',
          onUpdate: () => controls.update()
        });
      } else {
        camera.position.set(px, py, pz);
        controls.target.set(tx, ty, tz);
        controls.update();
      }
    }

    /* =========================================================================
       6. АВТОАНАЛИЗ ГЕОМЕТРИИ МОДЕЛИ (ОКНА, СТОЛ ПРЕПОДАВАТЕЛЯ, СТОЛ СТУДЕНТА)
       ========================================================================= */
    function clampInsideRoom(vec, marginXZ = 0.55, minY = 0.45, marginTop = 0.35) {
      return new THREE.Vector3(
        THREE.MathUtils.clamp(vec.x, roomBounds.min.x + marginXZ, roomBounds.max.x - marginXZ),
        THREE.MathUtils.clamp(vec.y, roomBounds.min.y + minY, roomBounds.max.y - marginTop),
        THREE.MathUtils.clamp(vec.z, roomBounds.min.z + marginXZ, roomBounds.max.z - marginXZ)
      );
    }

    // Определяем, на какой длинной стене (-X или +X) находятся оконные проёмы
    function detectWindowWallSign(roomShellMesh) {
      if (!roomShellMesh) return 1;

      const raycaster = new THREE.Raycaster();
      const center = new THREE.Vector3();
      roomBounds.getCenter(center);

      const minZ = roomBounds.min.z + 1.4;
      const maxZ = roomBounds.max.z - 1.4;
      const heights = [1.45, 1.85, 2.25];
      const samplesZ = 14;

      const measureSide = (sign) => {
        let openRays = 0;
        const hitXs = [];
        const dir = new THREE.Vector3(sign, 0, 0);

        for (let i = 0; i < samplesZ; i++) {
          const z = THREE.MathUtils.lerp(minZ, maxZ, i / (samplesZ - 1));
          for (let h = 0; h < heights.length; h++) {
            raycaster.set(new THREE.Vector3(center.x, heights[h], z), dir);
            const hits = raycaster.intersectObject(roomShellMesh, false);
            if (!hits.length) {
              openRays++;
            } else {
              hitXs.push(hits[0].point.x * sign);
            }
          }
        }

        // Оцениваем рельеф/откосы по разбросу глубины попаданий и числу вершин у стены
        let recessHits = 0;
        if (hitXs.length > 3) {
          const sorted = hitXs.slice().sort((a, b) => a - b);
          const baseWallDist = sorted[Math.floor(sorted.length * 0.35)];
          for (let i = 0; i < hitXs.length; i++) {
            if (Math.abs(hitXs[i] - baseWallDist) > 0.08) recessHits++;
          }
        }

        let wallVerts = 0;
        const posAttr = roomShellMesh.geometry && roomShellMesh.geometry.attributes.position;
        if (posAttr) {
          const wallEdge = sign > 0 ? roomBounds.max.x : roomBounds.min.x;
          const v = new THREE.Vector3();
          for (let i = 0; i < posAttr.count; i++) {
            v.fromBufferAttribute(posAttr, i).applyMatrix4(roomShellMesh.matrixWorld);
            if (Math.abs(v.x - wallEdge) < 0.5 && v.y > 0.7 && v.y < 3.1) {
              wallVerts++;
            }
          }
        }

        return openRays * 12 + recessHits * 3 + wallVerts * 0.1;
      };

      const scorePosX = measureSide(1);
      const scoreNegX = measureSide(-1);
      if (Math.abs(scorePosX - scoreNegX) < 1.5) return 1;
      return scorePosX >= scoreNegX ? 1 : -1;
    }

    // Находим отдельное рабочее место студента внутри объединённого меша Cube.004
    function findRepresentativeStudentDesk(studentNode, fallbackBox) {
      if (!studentNode) return null;

      const meshes = [];
      studentNode.traverse((child) => {
        if (child.isMesh && child.geometry && child.geometry.attributes.position) {
          meshes.push(child);
        }
      });
      if (!meshes.length) return null;

      // Кластеризация вершин по 2D-сетке XZ (шаг 0.28 м) для выделения одного стола
      const cellSize = 0.28;
      const cells = new Map();
      const v = new THREE.Vector3();

      meshes.forEach((mesh) => {
        mesh.updateMatrixWorld(true);
        const pos = mesh.geometry.attributes.position;
        const stride = pos.count > 6000 ? 2 : 1;
        for (let i = 0; i < pos.count; i += stride) {
          v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
          if (v.y < 0.25 || v.y > 1.35) continue;
          const gx = Math.floor(v.x / cellSize);
          const gz = Math.floor(v.z / cellSize);
          const key = gx + ',' + gz;
          let cell = cells.get(key);
          if (!cell) {
            cell = {
              gx, gz,
              minX: v.x, maxX: v.x,
              minY: v.y, maxY: v.y,
              minZ: v.z, maxZ: v.z
            };
            cells.set(key, cell);
          } else {
            if (v.x < cell.minX) cell.minX = v.x;
            if (v.x > cell.maxX) cell.maxX = v.x;
            if (v.y < cell.minY) cell.minY = v.y;
            if (v.y > cell.maxY) cell.maxY = v.y;
            if (v.z < cell.minZ) cell.minZ = v.z;
            if (v.z > cell.maxZ) cell.maxZ = v.z;
          }
        }
      });

      const visited = new Set();
      const clusters = [];
      const neighbors = [[1, 0], [-1, 0], [0, 1], [0, -1]];

      cells.forEach((startCell, startKey) => {
        if (visited.has(startKey)) return;
        const queue = [startKey];
        visited.add(startKey);
        const box = new THREE.Box3();

        while (queue.length) {
          const curKey = queue.pop();
          const c = cells.get(curKey);
          box.expandByPoint(new THREE.Vector3(c.minX, c.minY, c.minZ));
          box.expandByPoint(new THREE.Vector3(c.maxX, c.maxY, c.maxZ));

          for (let n = 0; n < neighbors.length; n++) {
            const nk = (c.gx + neighbors[n][0]) + ',' + (c.gz + neighbors[n][1]);
            if (cells.has(nk) && !visited.has(nk)) {
              visited.add(nk);
              queue.push(nk);
            }
          }
        }

        const size = new THREE.Vector3();
        box.getSize(size);
        if (size.x > 0.45 && size.z > 0.45 && size.x < 3.6 && size.z < 2.6) {
          const center = new THREE.Vector3();
          box.getCenter(center);
          clusters.push({ box, size, center });
        }
      });

      if (clusters.length) {
        // Выбираем стол ближе к передней центральной зоне аудитории (удобно осматривать со всех сторон)
        const idealPoint = new THREE.Vector3(-0.3, 0.75, 1.1);
        clusters.sort((a, b) => a.center.distanceTo(idealPoint) - b.center.distanceTo(idealPoint));
        return clusters[0].box;
      }

      // Надёжный fallback по Box3 массива студенческих столов
      if (fallbackBox && !fallbackBox.isEmpty()) {
        const c = new THREE.Vector3();
        fallbackBox.getCenter(c);
        return new THREE.Box3(
          new THREE.Vector3(c.x - 0.65, 0, c.z + 0.5),
          new THREE.Vector3(c.x + 0.65, Math.min(fallbackBox.max.y, 1.15), c.z + 1.7)
        );
      }
      return null;
    }

    function calibratePresetsFromModel(modelRoot) {
      modelRoot.updateMatrixWorld(true);

      // Поиск ключевых узлов прикреплённой модели
      let roomShell = null;
      let maxShellVol = 0;
      const teacherNodes = [];
      let studentNode = null;
      let boardNode = null;

      modelRoot.traverse((obj) => {
        const name = obj.name || '';
        if (obj.isMesh) {
          const b = new THREE.Box3().setFromObject(obj);
          const s = new THREE.Vector3();
          b.getSize(s);
          const vol = s.x * s.y * s.z;
          if (name === 'Plane' || (!roomShell && vol > maxShellVol)) {
            if (name === 'Plane' || vol > maxShellVol) {
              maxShellVol = vol;
              roomShell = obj;
            }
          }
        }

        if (name === 'Plane.002') boardNode = obj;
        if (name === 'Cube.004') studentNode = obj;
        if (name === 'Cube.005' || name === 'Cube.006') teacherNodes.push(obj);
      });

      const roomSize = new THREE.Vector3();
      const roomCenter = new THREE.Vector3();
      roomBounds.getSize(roomSize);
      roomBounds.getCenter(roomCenter);

      const eyeY = Math.min(1.62, roomSize.y * 0.45);
      const windowSign = detectWindowWallSign(roomShell);

      // Определяем, в какую сторону смотрит доска (+Z или -Z)
      let frontSign = 1;
      if (boardNode) {
        const bBox = new THREE.Box3().setFromObject(boardNode);
        const bCenter = new THREE.Vector3();
        bBox.getCenter(bCenter);
        frontSign = bCenter.z >= roomCenter.z ? 1 : -1;
      }

      // Направляем солнце по умолчанию со стороны найденной оконной стены внутрь аудитории
      DEFAULT_LIGHTING.sunAzimuth = windowSign > 0 ? 75 : 285;
      lightState.sunAzimuth = DEFAULT_LIGHTING.sunAzimuth;
      dom.sliderSunAzimuth.value = String(lightState.sunAzimuth);
      dom.valSunAzimuth.textContent = lightState.sunAzimuth + '°';

      // 1. Общий план — центр комнаты на уровне глаз, target на минимальном расстоянии для 360°
      if (CAMERA_PRESETS.overview.autoFit) {
        const pos = new THREE.Vector3(roomCenter.x, eyeY, roomCenter.z);
        const target = new THREE.Vector3(roomCenter.x, eyeY - 0.04, roomCenter.z + frontSign * 0.08);
        CAMERA_PRESETS.overview.position = [pos.x, pos.y, pos.z];
        CAMERA_PRESETS.overview.target = [target.x, target.y, target.z];
      }

      // 2. Оконная зона — ракурс на стену с окнами
      if (CAMERA_PRESETS.windowSide.autoFit) {
        const pos = clampInsideRoom(new THREE.Vector3(
          roomCenter.x - windowSign * (roomSize.x * 0.24),
          eyeY + 0.04,
          roomCenter.z - frontSign * (roomSize.z * 0.13)
        ));
        const target = new THREE.Vector3(
          windowSign > 0 ? roomBounds.max.x - 0.15 : roomBounds.min.x + 0.15,
          eyeY + 0.02,
          roomCenter.z + frontSign * (roomSize.z * 0.08)
        );
        CAMERA_PRESETS.windowSide.position = [pos.x, pos.y, pos.z];
        CAMERA_PRESETS.windowSide.target = [target.x, target.y, target.z];
      }

      // 3. Зона напротив окон — ракурс на внутреннюю стену
      if (CAMERA_PRESETS.innerWall.autoFit) {
        const innerSign = -windowSign;
        const pos = clampInsideRoom(new THREE.Vector3(
          roomCenter.x - innerSign * (roomSize.x * 0.24),
          eyeY + 0.04,
          roomCenter.z - frontSign * (roomSize.z * 0.12)
        ));
        const target = new THREE.Vector3(
          innerSign > 0 ? roomBounds.max.x - 0.15 : roomBounds.min.x + 0.15,
          eyeY + 0.02,
          roomCenter.z + frontSign * (roomSize.z * 0.09)
        );
        CAMERA_PRESETS.innerWall.position = [pos.x, pos.y, pos.z];
        CAMERA_PRESETS.innerWall.target = [target.x, target.y, target.z];
      }

      // 4. Стол преподавателя (Cube.005 + Cube.006)
      if (CAMERA_PRESETS.teacherDesk.autoFit && teacherNodes.length) {
        const tBox = new THREE.Box3();
        teacherNodes.forEach((n) => tBox.expandByObject(n));
        if (!tBox.isEmpty()) {
          const tCenter = new THREE.Vector3();
          tBox.getCenter(tCenter);
          // Ставим камеру со стороны шкафа с видом на стол преподавателя и аудиторию
          const dirToCenterX = tCenter.x >= roomCenter.x ? -1 : 1;
          const target = new THREE.Vector3(tCenter.x, Math.min(tBox.max.y * 0.66, 0.84), tCenter.z);
          const pos = clampInsideRoom(new THREE.Vector3(
            tCenter.x + dirToCenterX * 0.35,
            2.10,
            tCenter.z + frontSign * 2.20
          ));
          CAMERA_PRESETS.teacherDesk.position = [pos.x, pos.y, pos.z];
          CAMERA_PRESETS.teacherDesk.target = [target.x, target.y, target.z];
        }
      }

      // 5. Стол студента (выделенный кластер из Cube.004)
      if (CAMERA_PRESETS.studentDesk.autoFit && studentNode) {
        const allStudentsBox = new THREE.Box3().setFromObject(studentNode);
        const deskBox = findRepresentativeStudentDesk(studentNode, allStudentsBox);
        if (deskBox && !deskBox.isEmpty()) {
          const dCenter = new THREE.Vector3();
          deskBox.getCenter(dCenter);
          const sideDir = dCenter.x >= roomCenter.x ? -1 : 1;
          const target = new THREE.Vector3(dCenter.x, Math.min(deskBox.max.y * 0.68, 0.82), dCenter.z);
          const pos = clampInsideRoom(new THREE.Vector3(
            dCenter.x + sideDir * 1.25,
            2.20,
            dCenter.z - frontSign * 1.38
          ));
          CAMERA_PRESETS.studentDesk.position = [pos.x, pos.y, pos.z];
          CAMERA_PRESETS.studentDesk.target = [target.x, target.y, target.z];
        }
      }
    }

    /* =========================================================================
       7. АВТОЗАГРУЗКА ВСТРОЕННОЙ 3D-МОДЕЛИ
       ========================================================================= */
    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const gltfLoader = new THREE.GLTFLoader();

    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        const root = gltf.scene || (gltf.scenes && gltf.scenes[0]);
        if (!root) {
          showLoaderError('Модель пуста', 'В файле ' + MODEL_URL + ' не найдено 3D-сцены.');
          return;
        }

        // Настройка PBR-материалов и теней для всех мешей
        root.traverse((child) => {
          if (!child.isMesh) return;
          child.castShadow = true;
          child.receiveShadow = true;

          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((mat) => {
            if (!mat) return;
            if ('envMapIntensity' in mat) mat.envMapIntensity = 0.55;
            mat.needsUpdate = true;
          });
        });

        // Нормализация позиции: центрируем по X и Z, пол на Y = 0, сохраняем масштаб в метрах
        root.updateMatrixWorld(true);
        const rawBox = new THREE.Box3().setFromObject(root);
        const rawCenter = new THREE.Vector3();
        rawBox.getCenter(rawCenter);

        root.position.set(-rawCenter.x, -rawBox.min.y, -rawCenter.z);
        modelGroup.add(root);
        modelGroup.updateMatrixWorld(true);

        roomBounds.setFromObject(modelGroup);
        calibratePresetsFromModel(modelGroup);
        updateSunAndShadowBounds();

        // Стартуем сразу в центре аудитории («Общий план»)
        flyToPreset('overview', 0);

        dom.loaderOverlay.classList.add('hidden');
      },
      (xhr) => {
        if (xhr && xhr.total > 0) {
          const pct = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
          dom.loaderText.textContent = 'Загрузка модели… ' + pct + '%';
        }
      },
      (err) => {
        console.error('Ошибка загрузки модели:', err);
        const isFileProtocol = window.location.protocol === 'file:';
        showLoaderError(
          'Не удалось загрузить ' + MODEL_URL,
          isFileProtocol
            ? 'Откройте страницу через GitHub Pages или локальный сервер (например, python -m http.server).'
            : 'Убедитесь, что файл ' + MODEL_URL + ' лежит в той же папке, что и index.html.'
        );
      }
    );

    /* =========================================================================
       8. ИНТЕРФЕЙС: ЯРЛЫКИ, ВКЛАДКИ «РАКУРСЫ», «РЕНДЕР» И «СНИМОК PNG»
       ========================================================================= */
    let openTab = null; // 'views' | 'render' | null

    function setOpenTab(tabName) {
      openTab = openTab === tabName ? null : tabName;

      const viewsOpen = openTab === 'views';
      const renderOpen = openTab === 'render';

      dom.panelViews.classList.toggle('open', viewsOpen);
      dom.panelRender.classList.toggle('open', renderOpen);
      dom.btnTabViews.classList.toggle('active', viewsOpen);
      dom.btnTabRender.classList.toggle('active', renderOpen);
      dom.btnTabViews.setAttribute('aria-expanded', String(viewsOpen));
      dom.btnTabRender.setAttribute('aria-expanded', String(renderOpen));
    }

    dom.btnTabViews.addEventListener('click', () => setOpenTab('views'));
    dom.btnTabRender.addEventListener('click', () => setOpenTab('render'));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && openTab) setOpenTab(null);
    });

    // Генерация кнопок 5 ракурсов
    function renderPresetButtons() {
      dom.presetList.innerHTML = '';
      Object.entries(CAMERA_PRESETS).forEach(([key, preset], index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'preset-btn' + (key === activePresetKey ? ' active' : '');
        btn.dataset.preset = key;
        btn.innerHTML =
          '<span class="preset-info">' +
            '<span class="preset-name">' + preset.label + '</span>' +
            '<span class="preset-sub">' + preset.hint + '</span>' +
          '</span>' +
          '<span class="preset-idx">' + (index + 1) + '</span>';

        btn.addEventListener('click', () => {
          flyToPreset(key, 0.95);
          if (window.innerWidth <= 520) setOpenTab(null);
        });
        dom.presetList.appendChild(btn);
      });
    }

    function updateActivePresetUI() {
      dom.presetList.querySelectorAll('.preset-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.preset === activePresetKey);
      });
    }

    renderPresetButtons();

    // Применение настроек рендера
    function applyFillLight(factor) {
      hemiLight.intensity = BASE_HEMI_INTENSITY * factor;
      ambientLight.intensity = BASE_AMBIENT_INTENSITY * factor;
    }

    function applyBackground(mode) {
      lightState.bgMode = mode;
      scene.background = BG_COLORS[mode] || BG_COLORS.dark;
      document.querySelectorAll('#bg-mode-group .seg-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.bg === mode);
      });
    }

    function applyShadowsEnabled(enabled) {
      lightState.shadows = enabled;
      renderer.shadowMap.enabled = enabled;
      sunLight.castShadow = enabled;
      dom.btnShadows.classList.toggle('on', enabled);
      dom.btnShadows.setAttribute('aria-checked', String(enabled));

      modelGroup.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => { if (m) m.needsUpdate = true; });
        }
      });
    }

    function syncLightingUI() {
      dom.sliderExposure.value = String(lightState.exposure);
      dom.valExposure.textContent = lightState.exposure.toFixed(2);
      renderer.toneMappingExposure = lightState.exposure;

      dom.sliderSunIntensity.value = String(lightState.sunIntensity);
      dom.valSunIntensity.textContent = lightState.sunIntensity.toFixed(2);
      sunLight.intensity = lightState.sunIntensity;

      dom.sliderSunAzimuth.value = String(lightState.sunAzimuth);
      dom.valSunAzimuth.textContent = lightState.sunAzimuth + '°';

      dom.sliderSunElevation.value = String(lightState.sunElevation);
      dom.valSunElevation.textContent = lightState.sunElevation + '°';

      dom.sliderFill.value = String(lightState.fillIntensity);
      dom.valFill.textContent = lightState.fillIntensity.toFixed(2);
      applyFillLight(lightState.fillIntensity);

      applyShadowsEnabled(lightState.shadows);
      applyBackground(lightState.bgMode);
      updateSunAndShadowBounds();
    }

    dom.sliderExposure.addEventListener('input', (e) => {
      lightState.exposure = Number(e.target.value);
      dom.valExposure.textContent = lightState.exposure.toFixed(2);
      renderer.toneMappingExposure = lightState.exposure;
    });

    dom.sliderSunIntensity.addEventListener('input', (e) => {
      lightState.sunIntensity = Number(e.target.value);
      dom.valSunIntensity.textContent = lightState.sunIntensity.toFixed(2);
      sunLight.intensity = lightState.sunIntensity;
    });

    dom.sliderSunAzimuth.addEventListener('input', (e) => {
      lightState.sunAzimuth = Number(e.target.value);
      dom.valSunAzimuth.textContent = lightState.sunAzimuth + '°';
      updateSunAndShadowBounds();
    });

    dom.sliderSunElevation.addEventListener('input', (e) => {
      lightState.sunElevation = Number(e.target.value);
      dom.valSunElevation.textContent = lightState.sunElevation + '°';
      updateSunAndShadowBounds();
    });

    dom.sliderFill.addEventListener('input', (e) => {
      lightState.fillIntensity = Number(e.target.value);
      dom.valFill.textContent = lightState.fillIntensity.toFixed(2);
      applyFillLight(lightState.fillIntensity);
    });

    dom.btnShadows.addEventListener('click', () => {
      applyShadowsEnabled(!lightState.shadows);
    });

    document.querySelectorAll('#bg-mode-group .seg-btn').forEach((btn) => {
      btn.addEventListener('click', () => applyBackground(btn.dataset.bg));
    });

    dom.btnResetLight.addEventListener('click', () => {
      Object.assign(lightState, DEFAULT_LIGHTING);
      syncLightingUI();
    });

    // Снимок PNG текущего кадра без интерфейса
    dom.btnSnapshot.addEventListener('click', () => {
      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      link.download = 'classroom_' + stamp + '.png';
      link.href = dataUrl;
      link.click();
    });

    syncLightingUI();

    /* =========================================================================
       9. АДАПТАЦИЯ РАЗМЕРА И ЦИКЛ РЕНДЕРА
       ========================================================================= */
    function handleResize() {
      const w = dom.viewport.clientWidth || window.innerWidth || 1;
      const h = dom.viewport.clientHeight || window.innerHeight || 1;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', () => setTimeout(handleResize, 150));
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(handleResize).observe(dom.viewport);
    }
    handleResize();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
</body>
</html>
